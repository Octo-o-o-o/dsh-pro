<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>水循环学习卡</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;
  padding:24px;font-family:system-ui,sans-serif;
  background:#e8f6ff;color:#214768}
.card{width:min(100%,420px);padding:28px;border-radius:28px;
  background:white;text-align:center;box-shadow:0 12px 36px #8ac5e633}
h1{margin:0;font-size:30px;color:#1675b9}
.subtitle{color:#7194ad;margin:8px 0 24px}
.sky{height:180px;position:relative;overflow:hidden;
  border-radius:20px;background:linear-gradient(#63c4fa,#b8eaff)}
.cloud{position:absolute;width:130px;height:44px;background:white;
  border-radius:40px;filter:drop-shadow(0 4px 2px #70bce522)}
.cloud:before,.cloud:after{content:"";position:absolute;
  bottom:15px;border-radius:50%;background:white}
.cloud:before{width:60px;height:60px;left:20px}
.cloud:after{width:78px;height:78px;left:48px}
.c1{top:75px;left:10px;transform:scale(.85)}
.c2{top:45px;right:0;transform:scale(.8)}
.sun{position:absolute;right:24px;top:18px;width:42px;height:42px;
  background:#ffdb72;border-radius:50%}
.info{margin:24px 0;text-align:left;line-height:1.8;font-size:15px}
.step{padding:10px 12px;margin:8px 0;border-radius:12px;background:#f0f8ff}
.step b{color:#1675b9}
button{border:0;border-radius:14px;padding:13px 32px;
  background:#167fc1;color:white;font-size:16px;font-weight:700;
  cursor:pointer}
button:hover{background:#0967a5}
#status{min-height:24px;margin-top:14px;color:#32845c;font-size:14px}
</style>
</head>
<body>
<main class="card">
  <h1>水循环小课堂</h1>
  <p class="subtitle">跟着云朵，探索水的旅行！</p>
  <div class="sky" aria-label="蓝天白云插画">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
  </div>
  <section class="info">
    <div class="step">☀️ <b>蒸发</b>：太阳加热水，水变成水蒸气升上天空。</div>
    <div class="step">☁️ <b>凝结</b>：水蒸气遇冷，变成小水滴，形成云朵。</div>
    <div class="step">🌧️ <b>降水</b>：水滴聚集变大，形成雨落回地面。</div>
    <p>雨水汇入河流、湖泊和海洋，水又开始下一次旅行！</p>
  </section>
  <button id="start" type="button">Start</button>
  <div id="status" aria-live="polite"></div>
</main>
<script>
document.getElementById("start").addEventListener("click",function(){
  this.textContent="Done";
  document.getElementById("status").textContent="太棒了！水循环探索完成！";
});
</script>
</body>
</html>
