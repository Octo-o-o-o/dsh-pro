<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Cycle</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    font-family: system-ui, sans-serif;
    background: linear-gradient(#b9e9ff, #f4fbff);
    color: #124b85;
  }
  .card {
    width: min(90%, 420px); padding: 40px 24px;
    text-align: center; background: white;
    border-radius: 28px;
    box-shadow: 0 12px 35px #2878a526;
  }
  h1 { font-size: 2.5rem; margin: 0 0 24px; }
  .scene { font-size: 3rem; margin: 20px 0; }
  p { line-height: 1.7; color: #456782; }
  button {
    margin-top: 20px; padding: 12px 32px;
    border: 0; border-radius: 999px;
    background: #1675d1; color: white;
    font-size: 1rem; font-weight: 700;
    cursor: pointer;
  }
  button:hover { background: #105ba5; }
  button:focus-visible { outline: 3px solid #ffca58; }
</style>
</head>
<body>
  <main class="card">
    <h1>Water Cycle</h1>
    <div class="scene" aria-label="Sun, cloud, and rain">☀️ ☁️ 💧</div>
    <p>Sunshine warms water. Water vapor forms clouds, then falls as rain and flows back into rivers and oceans.</p>
    <button id="start">Start</button>
  </main>
  <script>
    const button = document.getElementById('start');
    button.addEventListener('click', () => {
      button.textContent = 'Done';
      button.disabled = true;
    });
  </script>
</body>
</html>
