name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke-bundle.mjs
      - name: Chrome transport regression
        run: npx vitest run packages/transport/test/transport.smoke.test.ts packages/transport/test/page-state.test.ts
        env:
          DSH_PRO_TRANSPORT_SMOKE: '1'
      - name: Built plugin acceptance
        run: node scripts/acceptance-smoke.mjs
