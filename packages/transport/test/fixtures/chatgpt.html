<!doctype html>
<html>
<head><meta charset="utf-8"><title>fixture</title></head>
<body>
  <div id="messages">
    <div data-message-author-role="user">OLD QUESTION</div>
    <article><div data-message-author-role="assistant">OLD ANSWER</div><button data-testid="copy-turn-action-button">Copy</button></article>
  </div>
  <button data-testid="model-switcher-dropdown-button">Pro</button>
  <form onsubmit="return false">
  <div id="prompt-textarea" contenteditable="true" style="min-height:40px;border:1px solid #ccc"></div>
  <input type="file" id="file" multiple aria-label="附加文件">
  <div id="attachments"></div>
  <button data-testid="send-button" style="display:none">Hidden duplicate</button>
  <button id="send-button" data-testid="send-button">Send</button>
  <button data-testid="stop-button" style="display:none">Stop</button>
  <button id="active-stop" aria-label="停止流式传输" style="display:none">Stop</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search)
    const slow = params.has('slow')
    const picker = document.querySelector('[data-testid="model-switcher-dropdown-button"]')
    picker.textContent = params.get('model') ?? 'Pro'
    const menuMode = params.get('menu') ?? ''
    const menu = document.createElement('div')
    menu.setAttribute('role', 'menu')
    menu.hidden = true
    document.body.append(menu)
    const addOption = (label, pro = false) => {
      const option = document.createElement('button')
      option.setAttribute('role', 'menuitemradio')
      option.textContent = label
      option.addEventListener('click', event => {
        event.preventDefault()
        if (/upgrade/i.test(label) || menuMode === 'upgrade-link-pro') {
          document.body.dataset.upgradeClicked = 'true'
          return
        }
        if (pro) document.body.dataset.proClicks = String(Number(document.body.dataset.proClicks ?? '0') + 1)
        if (menuMode === 'failed-pro') return
        picker.textContent = pro ? (params.get('pro-label') ?? 'Pro') : label
        menu.hidden = true
      })
      menu.append(option)
      return option
    }
    if (menuMode !== '') {
      addOption('Instant')
      if (menuMode !== 'free') {
        const option = addOption(menuMode === 'upgrade-pro' ? 'Upgrade to Pro' : 'Pro', true)
        if (menuMode === 'aria-disabled-pro') option.setAttribute('aria-disabled', 'true')
        if (menuMode === 'data-disabled-pro') option.setAttribute('data-disabled', '')
        if (menuMode === 'locked-pro') option.setAttribute('data-locked', 'true')
        if (menuMode === 'button-disabled-pro' || menuMode === 'duplicate-pro') option.disabled = true
        if (menuMode === 'upgrade-link-pro') option.innerHTML = '<a href="/pricing">Pro</a>'
        if (menuMode === 'duplicate-pro') addOption('Pro', true)
      }
    }
    picker.addEventListener('click', () => {
      picker.dataset.clicked = 'true'
      if (menuMode !== '') menu.hidden = false
    })
    document.addEventListener('keydown', event => { if (event.key === 'Escape') menu.hidden = true })
    if (params.get('picker') === 'none') picker.remove()
    const composer = document.getElementById('prompt-textarea')
    const send = document.getElementById('send-button')
    const messages = document.getElementById('messages')
    document.getElementById('file').addEventListener('change', event => {
      send.disabled = true
      setTimeout(() => { send.disabled = false }, 700)
      document.getElementById('attachments').replaceChildren(...[...event.target.files].map(file => {
        const card = document.createElement('span')
        card.textContent = file.name
        return card
      }))
    })
    send.addEventListener('click', () => {
      const question = composer.innerText
      composer.innerText = ''
      send.style.display = 'none'
      document.getElementById('active-stop').style.display = 'inline-block'
      const user = document.createElement('div')
      user.setAttribute('data-message-author-role', 'user')
      user.textContent = question
      messages.append(user)
      const message = document.createElement('div')
      message.setAttribute('data-message-author-role', 'assistant')
      messages.append(message)
      const copy = document.createElement('button')
      copy.setAttribute('aria-label', 'Copy')
      copy.setAttribute('data-testid', 'copy-turn-action-button')
      copy.style.display = 'none'
      message.append(copy)
      const text = 'FAKE ANSWER to ' + question
      if (slow) {
        message.textContent = 'INTRO ONLY'
        const code = document.createElement('pre')
        code.innerHTML = '<code>partial code</code><button aria-label="Copy">Copy</button>'
        message.append(code)
        setTimeout(() => {
          message.textContent = text + ' COMPLETE RESEARCH'
          copy.style.display = 'inline-block'
          message.append(copy)
          document.getElementById('active-stop').style.display = 'none'
          send.style.display = 'inline-block'
        }, 15000)
        return
      }
      let index = 0
      const timer = setInterval(() => {
        index += 1
        message.textContent = text.slice(0, index)
        message.append(copy)
        if (index >= text.length) {
          clearInterval(timer)
          copy.style.display = 'inline-block'
          document.getElementById('active-stop').style.display = 'none'
          send.style.display = 'inline-block'
        }
      }, 40)
    })
  </script>
</body>
</html>
